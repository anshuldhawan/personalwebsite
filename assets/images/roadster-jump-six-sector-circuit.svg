<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Three 250 m canyon chasms. Zero guardrails.</title><desc id="desc">Schematic clockwise stadium circuit with three 250 meter gaps, a suspended middle island and 315 meter radius end turns.</desc><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 H 0 V 50" fill="none" stroke="#17231a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7cf2a0"/></marker><g id="car"><path d="M-36 7 L-29 -5 L-12 -7 L0 -17 L20 -16 L33 -5 L42 0 L40 10 H-35Z" fill="#d52b37" stroke="#f5a0a0" stroke-width="2"/><circle cx="-21" cy="10" r="7" fill="#0b0d0a" stroke="#b6c9bd"/><circle cx="27" cy="10" r="7" fill="#0b0d0a" stroke="#b6c9bd"/></g></defs><rect width="1600" height="960" fill="#0b0d0a"/><rect width="1600" height="960" fill="url(#grid)"/><g font-family="ui-monospace, Menlo, monospace"><text x="64" y="62" font-size="20" fill="#7cf2a0" text-anchor="start" font-weight="400">COURSE ARCHITECTURE / SIX-SECTOR TIMED CIRCUIT</text><text x="64" y="118" font-size="37" fill="#e6efe1" text-anchor="start" font-weight="600">Three 250 m canyon chasms. Zero guardrails.</text><text x="64" y="160" font-size="21" fill="#98ab9a" text-anchor="start" font-weight="400">SCHEMATIC / NOT TO SCALE · Clockwise lap · 40 m mesa width</text><rect x="170" y="238" width="1260" height="445" rx="215" fill="none" stroke="#513725" stroke-width="2"/><rect x="199" y="267" width="1202" height="387" rx="192" fill="none" stroke="#513725" stroke-width="2"/><rect x="228" y="296" width="1144" height="329" rx="169" fill="none" stroke="#513725" stroke-width="2"/><rect x="257" y="325" width="1086" height="271" rx="146" fill="none" stroke="#513725" stroke-width="2"/><rect x="286" y="354" width="1028" height="213" rx="123" fill="no