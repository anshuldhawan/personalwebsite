<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">One press commits the arc. Speed earns the landing.</title><desc id="desc">Schematic side elevation of a 250 meter canyon leap, clean commit window, flight phases, failure trajectories and end-on barrel roll. Not to scale.</desc><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 H 0 V 50" fill="none" stroke="#17231a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7cf2a0"/></marker><g id="car"><path d="M-36 7 L-29 -5 L-12 -7 L0 -17 L20 -16 L33 -5 L42 0 L40 10 H-35Z" fill="#d52b37" stroke="#f5a0a0" stroke-width="2"/><circle cx="-21" cy="10" r="7" fill="#0b0d0a" stroke="#b6c9bd"/><circle cx="27" cy="10" r="7" fill="#0b0d0a" stroke="#b6c9bd"/></g></defs><rect width="1600" height="920" fill="#0b0d0a"/><rect width="1600" height="920" fill="url(#grid)"/><g font-family="ui-monospace, Menlo, monospace"><text x="64" y="62" font-size="20" fill="#7cf2a0" text-anchor="start" font-weight="400">ROADSTER JUMP / 120 HZ DETERMINISTIC STUNT ENVELOPE</text><text x="64" y="118" font-size="37" fill="#e6efe1" text-anchor="start" font-weight="600">One press commits the arc. Speed earns the landing.</text><text x="64" y="160" font-size="21" fill="#98ab9a" text-anchor="start" font-weight="400">SCHEMATIC / NOT TO SCALE · Horizontal travel = launch speed × flight time</text><rect x="64" y="195" width="1472" height="435" rx="8" fill="#0f1711" stroke="#294331"/><path d="M80 410 H370 V600 H80Z M1230 410 H1520 V600 H1230Z" fill="#563722" stroke="#d99b66" stroke-width="3"/><path d="M80 450 H360 M1240 450 H1520" fill="none" stroke="#845635" stroke-width="2" /><path d="M80 490 H360 M1240 490 H1520" fill="none" stroke="#845635" stroke-width="2" /><path d="M80 530 H360 M1240 530 H1520" fill="none" stroke="#845635" stroke-width="2" /><path d="M80 570 H360 M1240 570 H1520" fill="none" stroke="#845635" stroke-width="2" /><rect x="220" y="377" width="118" height="32" rx="2" fill="#29503a" stroke="#7cf2a0"/><text x="210" y="257" font-size="21" fill="#7cf2a0" text-anchor="start" font-weight="400">CLEAN COMMIT WINDOW</text><text x="210" y="287" font-size="21" fill="#e6efe1" text-anchor="start" font-weight="400">−40.5 → −13.5 m</text><text x="210" y="317" font-size="20" fill="#98ab9a" text-anchor="start" font-weight="400">Ideal press: −27 m</text><path d="M280 332 V377" fill="none" stroke="#7cf2a0" stroke-width="2" /><path d="M340 410 C490 410 550 235 800 235 S1120 410 1290 410" fill="none" stroke="#7cf2a0" stroke-width="5" /><path d="M310 410 C540 260 950 255 1230 480" fill="none" stroke="#ef6666" stroke-width="3" stroke-dasharray="10 9"/><text x="870" y="490" font-size="20" fill="#ef6666" text-anchor="start" font-weight="400">EARLY → CLIFF COLLISION</text><path d="M365 410 Q430 450 490 586" fill="none" stroke="#ef6666" stroke-width="3" stroke-dasharray="10 9"/><text x="520" y="570" font-size="20" fill="#ef6666" text-anchor="start" font-weight="400">LATE → CHARGE SUPPORT LOST</text><path d="M370 540 H1230" fill="none" stroke="#7cf2a0" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="800" y="530" font-size="24" fill="#f59e0b" text-anchor="middle" font-weight="400">250 m OPEN CHASM</text><text x="800" y="595" font-size="20" fill="#38bdf8" text-anchor="middle" font-weight="400">700 m gorge depth ↓</text><use href="#car" transform="translate(340 399) rotate(0)"/><use href="#car" transform="translate(515 333) rotate(-22)"/><use href="#car" transform="translate(800 225) rotate(180)"/><use href="#car" transform="translate(1115 348) rotate(0)"/><use href="#car" transform="translate(1290 399) rotate(0)"/><text x="105" y="460" font-size="18" fill="#7cf2a0" text-anchor="start" font-weight="400">0.00 s / LIFTOFF</text><text x="105" y="488" font-size="17" fill="#98ab9a" text-anchor="start" font-weight="400">X = −15 m · 0° roll</text><text x="430" y="210" font-size="18" fill="#7cf2a0" text-anchor="start" font-weight="400">0.55 s / SPIN-UP</text><text x="430" y="238" font-size="17" fill="#98ab9a" text-anchor="start" font-weight="400">+31.2° path angle</text><text x="790" y="183" font-size="18" fill="#7cf2a0" text-anchor="start" font-weight="400">1.40 s / INVERTED APEX</text><text x="790" y="211" font-size="17" fill="#98ab9a" text-anchor="start" font-weight="400">180° roll · +9.75 m visual rise</text><text x="1030" y="270" font-size="18" fill="#7cf2a0" text-anchor="start" font-weight="400">2.30 s / UPRIGHT LOCK</text><text x="1030" y="298" font-size="17" fill="#98ab9a" text-anchor="start" font-weight="400">360° roll</text><text x="1260" y="460" font-size="18" fill="#7cf2a0" text-anchor="start" font-weight="400">2.80 s / TOUCHDOWN</text><text x="1260" y="488" font-size="17" fill="#98ab9a" text-anchor="start" font-weight="400">X = +265 m</text><text x="70" y="660" font-size="22" fill="#7cf2a0" text-anchor="start" font-weight="400">0.12 s PNEUMATIC CHARGE → FIXED 2.80 s FLIGHT → FOUR-TIRE TOUCHDOWN</text><rect x="64" y="695" width="1472" height="166" rx="8" fill="#111b14" stroke="#294331"/><text x="90" y="726" font-size="18" fill="#98ab9a" text-anchor="start" font-weight="400">END-ON ROLL / DIFFERENTIAL r × F THRUST</text><g transform="translate(210 785) rotate(0)"><path d="M-35 8 L-30 -11 L-16 -22 H16 L30 -11 L35 8Z" fill="#c82c3d" stroke="#e6efe1" stroke-width="2"/><rect x="-31" y="4" width="9" height="15" fill="#82918b"/><rect x="22" y="4" width="9" height="15" fill="#82918b"/><path d="M-22 20 L-26 41 M22 20 L26 41" fill="none" stroke="#38bdf8" stroke-width="4" /></g><text x="210" y="847" font-size="20" fill="#7cf2a0" text-anchor="middle" font-weight="400">0°</text><g transform="translate(495 785) rotate(90)"><path d="M-35 8 L-30 -11 L-16 -22 H16 L30 -11 L35 8Z" fill="#c82c3d" stroke="#e6efe1" stroke-width="